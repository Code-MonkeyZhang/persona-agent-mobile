name: Build for iOS

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
permissions:
  contents: read
  pull-requests: write
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run build ios
        run: |
          cd react-native && npm i
          cd ios && pod install && cd ..
          npm run build:ios
