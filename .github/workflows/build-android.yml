name: Build for Android

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
permissions:
  contents: read
  pull-requests: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Run build apk
        run: |
          cd react-native && npm i
          cd android
          ./gradlew assembleDebug
