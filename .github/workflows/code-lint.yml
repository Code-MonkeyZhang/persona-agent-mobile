name: Code Lint

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
permissions:
  contents: read
  pull-requests: write
jobs:
  code-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run package install
        run: cd react-native && npm i
      - name: Run code format
        run: cd react-native && npm run format
      - name: Run code lint
        run: cd react-native && npm run lint
